# CI for the privileged helper daemon.
#
# Runs on humboldt-runner (Bazzite, Linux). The bridge can't be
# meaningfully built or tested on Linux because of the cgo+libmtp+libusb
# dependency tree (those libraries' Homebrew paths are darwin-only).
# The Swift menu-bar app obviously needs macOS. So this workflow only
# covers the helper, which is pure Go with no native dependencies.
#
# Mirror to Forgejo with:
#   git remote add forgejo https://forge.terrace.zone/<user>/Comprador.git
#   git push forgejo master
name: Helper

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: docker
    container:
      # The `docker://` prefix is the runner-label syntax (e.g.
      # `docker:docker://node:20-bookworm`), not the container.image
      # syntax. The Docker daemon parses the prefix as "docker:/..."
      # and rejects it. Plain `golang:1.21-bookworm` is what works.
      image: golang:1.21-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: go vet
        working-directory: helper
        run: go vet ./...

      - name: go test
        working-directory: helper
        run: go test -v -race ./...
