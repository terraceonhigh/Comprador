# Release pipeline.
#
# Activated 2026-05-04 once Apple Developer Program enrollment landed
# and the Developer ID Application certificate was exported as a base64
# .p12 into repo secrets. Triggers on tag push (v*).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   APPLE_DEV_ID_CERT_P12_BASE64    base64 of the exported .p12
#   APPLE_DEV_ID_CERT_PASSWORD      .p12 export password
#   APPLE_ID                         Apple ID email
#   APPLE_TEAM_ID                    10-char team ID
#   APPLE_APP_SPECIFIC_PASSWORD      from appleid.apple.com
#   KEYCHAIN_PASSWORD                random; protects temp keychain
#
# Free macOS minutes on GitHub Actions are unlimited for public repos
# as of 2026.

name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-sign-notarize:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install libmtp libusb go

      - name: Import Developer ID certificate into a temp keychain
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEV_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEV_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$CERT_BASE64" | base64 -d > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -l build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          rm /tmp/cert.p12

      - name: Build app bundle (ad-hoc signed by Makefile)
        run: make dist-swiftc

      - name: Re-sign with Developer ID
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
                      | awk '/Developer ID Application/{print $2; exit}')
          echo "Signing with $IDENTITY"

          # codesign --deep is deprecated and doesn't reliably propagate
          # --options runtime / --timestamp to nested binaries, which
          # notarytool flags as critical errors. Sign each embedded
          # binary individually, deepest-first, then the bundle.
          BUNDLE=dist/Comprador.app
          for path in \
            "$BUNDLE/Contents/Frameworks/libmtp.9.dylib" \
            "$BUNDLE/Contents/Frameworks/libusb-1.0.0.dylib" \
            "$BUNDLE/Contents/Resources/bridge"
          do
            if [ -e "$path" ]; then
              echo "Signing $path"
              codesign --force --options runtime --timestamp \
                --sign "$IDENTITY" "$path"
            fi
          done

          echo "Signing bundle"
          # Sign with the debug entitlements file (no
          # com.apple.developer.system-extension.install). The production
          # entitlements file requires a provisioning profile embedded
          # as Contents/embedded.provisionprofile, which the workflow
          # does not currently provision. v0.3.0 shipped with the
          # production entitlements and AMFI rejected the binary at
          # launch with -413 "No matching profile found".
          # Restore Comprador.entitlements when:
          #   1. a DriverKit USB extension is actually being shipped,
          #      AND
          #   2. the provisioning profile is downloaded from the Apple
          #      Developer portal, base64'd into a CI secret, and the
          #      workflow decodes + drops it into the bundle here.
          # Until then, the debug entitlements have everything the
          # shipped feature set actually uses (just the USB device
          # access entitlement).
          codesign --force --options runtime --timestamp \
            --entitlements MenuBarApp/Comprador.debug.entitlements \
            --sign "$IDENTITY" \
            "$BUNDLE"

          codesign --verify --strict --verbose=2 "$BUNDLE"

      - name: Notarize the .app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          # notarytool wants a flat archive. Re-zip the *signed* app
          # (overwriting whatever dist-swiftc left).
          rm -f dist/Comprador.zip
          ditto -c -k --keepParent dist/Comprador.app dist/Comprador.zip
          # Submit and capture the JSON output so we can extract the
          # submission id even on success. --output-format json keeps
          # parsing trivial.
          SUBMIT_OUT=$(xcrun notarytool submit dist/Comprador.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --output-format json \
            --wait)
          echo "$SUBMIT_OUT"
          SUBMIT_ID=$(echo "$SUBMIT_OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          STATUS=$(echo "$SUBMIT_OUT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
          if [ "$STATUS" != "Accepted" ]; then
            echo "::group::notarytool log for $SUBMIT_ID (status=$STATUS)"
            xcrun notarytool log "$SUBMIT_ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" || true
            echo "::endgroup::"
            exit 1
          fi
          xcrun stapler staple dist/Comprador.app
          xcrun stapler validate dist/Comprador.app

      - name: Build DMG from stapled app
        run: |
          set -euo pipefail
          # The Makefile target rebuilds dist-swiftc as a dependency,
          # which would clobber our stapled app. Inline the dmg steps
          # against the already-stapled app instead.
          rm -f dist/Comprador.dmg dist/Comprador-rw.dmg
          hdiutil create -size 100m -fs HFS+ -volname "Comprador" \
            -srcfolder dist/Comprador.app \
            -format UDRW dist/Comprador-rw.dmg
          hdiutil attach dist/Comprador-rw.dmg \
            -mountpoint /Volumes/Comprador -nobrowse -quiet
          ln -sf /Applications /Volumes/Comprador/Applications
          hdiutil detach /Volumes/Comprador -quiet
          hdiutil convert dist/Comprador-rw.dmg \
            -format UDZO -imagekey zlib-level=9 \
            -o dist/Comprador.dmg
          rm -f dist/Comprador-rw.dmg

      - name: Sign and notarize the DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
                      | awk '/Developer ID Application/{print $2; exit}')
          codesign --force --sign "$IDENTITY" --timestamp dist/Comprador.dmg
          xcrun notarytool submit dist/Comprador.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple dist/Comprador.dmg
          xcrun stapler validate dist/Comprador.dmg

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/Comprador.dmg
          fail_on_unmatched_files: true
