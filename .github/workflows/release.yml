#
#   1. Generate the Developer ID Application certificate via Xcode or
#      developer.apple.com → Certificates.
#   2. Export it from Keychain as a .p12 with a password.
#   3. Encode to base64:
#        base64 -i DeveloperID.p12 | pbcopy
#   4. Set GitHub repo secrets (Settings → Secrets and variables → Actions):
#        APPLE_DEV_ID_CERT_P12_BASE64    — the base64 from step 3
#        APPLE_DEV_ID_CERT_PASSWORD      — the .p12 export password
#        APPLE_ID                         — Apple ID email
#        APPLE_TEAM_ID                    — 10-char team ID from
#                                           developer.apple.com membership page
#        APPLE_APP_SPECIFIC_PASSWORD     — generated at appleid.apple.com
#                                           → Sign-In & Security
#                                           → App-Specific Passwords
#        KEYCHAIN_PASSWORD               — any random string; used to
#                                           protect the temp keychain
#                                           on the runner
#   5. Uncomment everything below the `---` line.
#   6. Tag a release: `git tag v0.1.1 && git push --tags`. CI builds,
#      signs, notarizes, staples, and uploads to the GitHub Release.
#
# Free macOS minutes on GitHub Actions are unlimited for public repos
# as of 2026, so this costs nothing to run.
